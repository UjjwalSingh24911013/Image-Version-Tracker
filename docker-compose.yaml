version: "3.8"

services:
  postgres:
    image: postgres:15
    container_name: image-tracker-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: image_tracker
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  api:
    build: .
    container_name: image-tracker-api
    depends_on:
      - postgres
    environment:
      DB_HOST: postgres
      DB_NAME: image_tracker
      DB_USER: postgres
      DB_PASSWORD: postgres
    ports:
      - "8000:8000"
    command: uvicorn api:app --host 0.0.0.0 --port 8000
    volumes:
      - .:/app
    restart: always

volumes:
  pgdata:
